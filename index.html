<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СТЛЧК — интернет-магазин стульев</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <p class="header__logo">СТЛЧК</p>
      <button class="header__cart-toggle" id="cartToggle" type="button">
        Корзина <span class="header__cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="catalog" aria-labelledby="catalog-heading">
      <h1 id="catalog-heading">Каталог стульев</h1>
      <ul class="catalog__grid" id="productGrid"></ul>
    </section>
  </main>

  <aside class="cart-panel" id="cartPanel" hidden aria-labelledby="cart-heading">
    <div class="cart-panel__header">
      <h2 id="cart-heading">Корзина</h2>
      <button class="cart-panel__close" id="cartClose" type="button" aria-label="Закрыть корзину">×</button>
    </div>

    <ul class="cart-panel__list" id="cartList"></ul>

    <div class="cart-panel__footer">
      <p class="cart-panel__total">Итого: <span id="cartTotalValue">0 ₽</span></p>
      <button class="cart-panel__checkout" id="checkoutBtn" type="button">Оформить заказ</button>
    </div>
  </aside>

  <div class="overlay" id="overlay" hidden></div>

  <dialog class="order-modal" id="orderModal" aria-labelledby="order-heading">
    <form class="order-form" id="orderForm">
      <h2 id="order-heading">Оформление заказа</h2>

      <p class="order-form__success" id="orderSuccess" hidden>Заказ создан!</p>

      <label class="order-form__field">
        <span>Имя</span>
        <input type="text" name="firstName" required>
      </label>

      <label class="order-form__field">
        <span>Фамилия</span>
        <input type="text" name="lastName" required>
      </label>

      <label class="order-form__field">
        <span>Адрес доставки</span>
        <input type="text" name="address" required>
      </label>

      <label class="order-form__field">
        <span>Контактный номер телефона</span>
        <input type="tel" name="phone" required>
      </label>

      <div class="order-form__actions">
        <button type="button" class="order-form__cancel" id="orderCancel">Отмена</button>
        <button type="submit" class="order-form__submit">Создать заказ</button>
      </div>
    </form>
  </dialog>

  <footer class="footer">
    <p>© 2026 СТЛЧК</p>
  </footer>

  <script src="js/data.js" defer></script>
  <script src="js/render.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/order.js" defer></script>
</body>
</html>
